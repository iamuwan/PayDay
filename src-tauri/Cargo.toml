[package]
name = "payday"
version = "1.0.0"
description = "PayDay — a personal money tracker for macOS and Windows"
authors = ["Uwan Perera"]
license = "MIT"
edition = "2021"

[lib]
name = "payday_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
